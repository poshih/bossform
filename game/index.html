<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="BOSSFORM — an arena mech shoot-'em-up. Move and aim separately, fill the boss gauge and transform into your frame's colossal boss form.">
<title>BOSSFORM — arena mech combat</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03040a; }
  #app { position: fixed; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #game { display: block; position: absolute; left: 0; top: 0; outline: none; touch-action: none; image-rendering: pixelated; }
  #boot {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px; box-sizing: border-box; text-align: center; color: #bfefff;
    font: 600 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    letter-spacing: .18em; text-transform: uppercase; background: radial-gradient(ellipse at 50% 55%, #0b1a33 0%, #03040a 70%);
    z-index: 50;
  }
  #boot h1 { margin: 0; font-size: clamp(22px, 6vw, 44px); letter-spacing: .3em; color: #e9fbff; text-shadow: 0 0 12px #27e1ff, 3px 0 0 #ff2e88; font-weight: 800; }
  #boot .tag { font-size: 11px; color: #ffc34d; letter-spacing: .3em; }
  #boot-bar { width: min(320px, 70vw); height: 4px; background: #0f2440; overflow: hidden; position: relative; }
  #boot-bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: linear-gradient(90deg, transparent, #27e1ff, #ffc34d, transparent); animation: bootslide 1.2s linear infinite; }
  @keyframes bootslide { from { left: -30%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { #boot-bar::after { animation: none; left: 35%; } }
  #boot-status { min-height: 1.4em; font-size: 12px; color: #9fd9ee; }
  #boot-retry {
    display: none; min-width: 120px; min-height: 44px; padding: 0 20px; border: 1px solid #27e1ff; background: #081a2c; color: #e9fbff;
    font: inherit; letter-spacing: .2em; cursor: pointer;
  }
  #boot-retry:focus-visible { outline: 2px solid #ffc34d; outline-offset: 3px; }
  #boot.failed #boot-bar { display: none; }
  #boot.failed #boot-retry { display: inline-block; }
  #boot.done { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="boot" role="region" aria-label="Loading BOSSFORM">
    <h1>BOSSFORM</h1>
    <div class="tag">become the boss</div>
    <div id="boot-bar" role="progressbar" aria-label="Loading" aria-busy="true"></div>
    <div id="boot-status" role="status" aria-live="polite">Downloading the game…</div>
    <button id="boot-retry" type="button">Retry</button>
    <noscript><div style="color:#ffb4c8">BOSSFORM needs JavaScript and WebGL to run.</div></noscript>
  </div>
</div>
<script>
  // Startup watchdog: a failed or stalled module load must never leave a silent spinner.
  (function () {
    var boot = document.getElementById('boot');
    var status = document.getElementById('boot-status');
    var retry = document.getElementById('boot-retry');
    function fail(message) {
      if (window.__bossformStarted) return;
      boot.classList.add('failed');
      status.textContent = message;
      retry.focus();
    }
    retry.addEventListener('click', function () { location.reload(); });
    window.__bossformBootFail = fail;
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT') fail('The game files could not be downloaded. Check your connection and retry.');
      else if (t === window || !t) fail('BOSSFORM hit an error while starting. Retry to load it again.');
    }, true);
    window.addEventListener('unhandledrejection', function () {
      fail('BOSSFORM hit an error while starting. Retry to load it again.');
    });
    setTimeout(function () {
      if (!window.__bossformStarted && !boot.classList.contains('failed')) status.textContent = 'Still loading — a slow connection can take a little longer…';
    }, 12000);
    setTimeout(function () { fail('Loading is taking too long. Retry to download the game again.'); }, 45000);
  })();
</script>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
