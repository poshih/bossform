<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="BOSSFORM — a vector mech battle arena. Move and aim separately, graze for energy, and become the boss.">
<title>BOSSFORM — vector mech arena</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #app { position: fixed; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #stage, #hud { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #hud { pointer-events: none; }
  #menus { position: absolute; inset: 0; }
  #notice {
    position: absolute; left: 50%; top: 14%; transform: translateX(-50%); max-width: min(90vw, 560px); padding: 10px 18px; z-index: 30;
    border: 1px solid #ff5c8a; background: rgba(20, 4, 12, .88); color: #ffd6e4; text-align: center;
    font: 600 13px/1.4 Inter, "Segoe UI", system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase;
  }
  #notice[hidden] { display: none; }
  #boot {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px;
    box-sizing: border-box; text-align: center; color: #bfefff; background:
      radial-gradient(circle at 50% 34%, rgba(29, 78, 110, .38), transparent 38%),
      linear-gradient(180deg, #02040a, #000); z-index: 50;
    font: 600 13px/1.4 Inter, "Segoe UI", system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase;
  }
  #boot::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, transparent, rgba(53,208,255,.12), transparent); animation: bootwipe 2.6s ease-in-out infinite; }
  #boot h1 { margin: 0; font-size: clamp(22px, 6vw, 44px); letter-spacing: .34em; font-weight: 700; color: #e9fbff; text-shadow: 0 0 14px #35d0ff; animation: boottitle .8s ease-out both, bootglow 2.2s ease-in-out .8s infinite; }
  #boot .tag { font-size: 11px; color: #7cf0ff; letter-spacing: .32em; }
  #boot-bar { width: min(320px, 70vw); height: 2px; background: #0b1a26; overflow: hidden; position: relative; box-shadow: 0 0 0 1px rgba(53,208,255,.16), 0 0 22px rgba(53,208,255,.16); }
  #boot-bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: linear-gradient(90deg, transparent, #35d0ff, transparent); animation: bootslide 1.2s linear infinite; }
  @keyframes bootslide { from { left: -30%; } to { left: 100%; } }
  @keyframes bootwipe { from { transform: translateX(-80%); opacity: 0; } 40% { opacity: .7; } to { transform: translateX(80%); opacity: 0; } }
  @keyframes boottitle { from { opacity: 0; letter-spacing: .48em; } to { opacity: 1; letter-spacing: .34em; } }
  @keyframes bootglow { 0%, 100% { text-shadow: 0 0 14px #35d0ff; } 50% { text-shadow: 0 0 28px #35d0ff, 0 0 48px #ff5c8a; } }
  @media (prefers-reduced-motion: reduce) { #boot::before, #boot h1, #boot-bar::after { animation: none; } #boot-bar::after { left: 35%; } }
  #boot-status { min-height: 1.4em; font-size: 12px; color: #8fc9d8; }
  #boot-retry { display: none; min-width: 120px; min-height: 44px; padding: 0 20px; border: 1px solid #35d0ff; background: #04121c; color: #e9fbff; font: inherit; letter-spacing: .2em; cursor: pointer; }
  #boot-retry:focus-visible { outline: 2px solid #ffd23f; outline-offset: 3px; }
  #boot.failed #boot-bar { display: none; }
  #boot.failed #boot-retry { display: inline-block; }
  #boot.done { display: none; }
</style>
</head>
<body>
<div id="app">
  <canvas id="stage" tabindex="0" aria-label="BOSSFORM battle arena"></canvas>
  <canvas id="hud" aria-hidden="true"></canvas>
  <div id="menus"></div>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <div id="boot" role="region" aria-label="Loading BOSSFORM">
    <h1>BOSSFORM</h1>
    <div class="tag">become the boss</div>
    <div id="boot-bar" role="progressbar" aria-label="Loading" aria-busy="true"></div>
    <div id="boot-status" role="status" aria-live="polite">Downloading the game…</div>
    <button id="boot-retry" type="button">Retry</button>
    <noscript>BOSSFORM needs JavaScript and WebGL to run.</noscript>
  </div>
</div>
<script>
  // Startup watchdog: a failed or stalled module load must never leave a silent spinner.
  (function () {
    var boot = document.getElementById('boot');
    var status = document.getElementById('boot-status');
    var retry = document.getElementById('boot-retry');
    function fail(message) {
      if (window.__bossformStarted) return;
      boot.classList.add('failed');
      status.textContent = message;
      retry.focus();
    }
    retry.addEventListener('click', function () { location.reload(); });
    window.__bossformBootFail = fail;
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT') fail('The game files could not be downloaded. Check your connection and retry.');
      else if (t === window || !t) fail('BOSSFORM hit an error while starting. Retry to load it again.');
    }, true);
    window.addEventListener('unhandledrejection', function () { fail('BOSSFORM hit an error while starting. Retry to load it again.'); });
    setTimeout(function () {
      if (!window.__bossformStarted && !boot.classList.contains('failed')) status.textContent = 'Still loading — a slow connection can take a little longer…';
    }, 12000);
    setTimeout(function () { fail('Loading is taking too long. Retry to download the game again.'); }, 45000);
  })();
</script>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
